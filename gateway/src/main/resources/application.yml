spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # ----- Microservicio auth (gestión de usuarios) -> puerto 8081 -----
            # Todo lo relacionado con cuentas, login, registro, admin y el flujo OAuth2 de Google.
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/my-account/**,/api/v1/admin/**,/oauth2/**,/login/**

            # ----- Microservicio notes (notas del usuario) -> puerto 8082 -----
            - id: notes-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/notes/**

server:
  port: 8080

# Mismos valores que auth/notes: el secreto DEBE ser idéntico para poder validar la firma.
jwt:
  secret: ${JWT_SECRET}
  issuer: myletters-auth
  audience: myletters

# CORS centralizado: orígenes del frontend permitidos (coma-separados si hay varios).
app:
  cors:
    allowed-origins: http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
