# Perfil de test: base de datos H2 en memoria (modo PostgreSQL) para que el
# contexto de Spring pueda arrancar sin Postgres ni el archivo .env.
# Sobrescribe todas las propiedades que en application.properties usan ${...},
# para que contextLoads sea totalmente autosuficiente.

spring.datasource.url=jdbc:h2:mem:authtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Valores de prueba (no son secretos reales). El secreto debe tener al menos
# 32 bytes para poder firmar con HMAC-SHA256.
jwt.secret=test-secret-key-para-hmac-sha256-con-longitud-suficiente-1234567890
jwt.expiration=3600000

# Credenciales OAuth2 ficticias: solo para que el auto-config de Google
# registre el cliente al arrancar; nunca se usan en los tests.
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
