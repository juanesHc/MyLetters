spring.application.name=notes
server.port=8082

# MongoDB (Docker local). La base de datos "notes" se crea sola al insertar el primer documento.
spring.data.mongodb.uri=mongodb://localhost:27017/notes

# JWT: notes valida los tokens que emite auth, por eso comparte el MISMO secreto.
# issuer y audience deben coincidir con los del microservicio auth.
jwt.secret=${JWT_SECRET}
jwt.issuer=myletters-auth
jwt.audience=myletters

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
