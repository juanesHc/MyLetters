spring.application.name=notes
server.port=8082


# Spring Boot 4 modularizó el autoconfig: la CONEXIÓN a Mongo usa el prefijo nuevo
# spring.mongodb.* (el viejo spring.data.mongodb.uri se ignora y cae al default 27017).
spring.mongodb.uri=mongodb://localhost:27018/notes

spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET}
jwt.issuer=myletters-auth
jwt.audience=myletters

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
