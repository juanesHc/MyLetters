# MongoDB local para el microservicio notes.
# Levantar:   docker compose up -d
# Apagar:     docker compose down        (los datos se conservan en el volumen)
# Borrar todo: docker compose down -v    (elimina también los datos)
services:
  mongo:
    image: mongo:7
    container_name: myletters-mongo
    # Host 27018 -> contenedor 27017. Usamos 27018 en el host para no chocar con un
    # MongoDB nativo que pueda estar corriendo en el 27017.
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
